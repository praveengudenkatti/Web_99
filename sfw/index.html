<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Waifu Image</title>
    <link rel="icon" href="https://graph.org/file/14efde00677b1fada901a.png" type="image/x-icon">
    <meta property="og:title" content="Random Waifu Image">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alam.eu.org/sfw">
    <meta property="og:image" content="https://i.ibb.co/RkDT2DRK/Screenshot-2026-07-12-19-58-55-41-1c337646f29875672b5a61192b9010f9.png">
    <meta property="og:description" content="A SFW Site that can Generate Random Waifu images.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Raleway:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./sfw/style.css">
  </head>
  <body>

    <!-- Background layers -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="stars" id="stars"></div>

    <div class="wrapper">

      <header>
        <div class="badge">✦ Gallery ✦</div>
        <h1>Random Waifu</h1>
        <p class="subtitle">a new face, every summon</p>
      </header>

      <div class="card">
        <div class="image-frame">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="skeleton" id="skeleton"></div>
          <div class="pulse-ring" id="pulse"></div>
          <div class="image-container">
            <img id="waifu-image" src="" alt="Waifu Image" class="loading">
          </div>
          <div class="scanlines"></div>
        </div>

        <div class="card-footer">
          <button class="btn btn-primary" id="new-image-btn">
            <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Summon
          </button>
          <button class="btn btn-secondary" id="download-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Steal It
          </button>
        </div>
      </div>

      <div class="tag-strip">
        <span class="tag">SFW</span>
        <span class="tag">waifu</span>
        <span class="tag">Anime</span>
      </div>

      <footer>Waifu Images &nbsp;·&nbsp; powered by Eyepatch</footer>

    </div>

    <div class="toast" id="toast"></div>

    <script src="./sfw/script.js"></script>
  </body>
</html>
